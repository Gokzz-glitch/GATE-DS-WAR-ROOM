<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GATE DA War Room</title>
    <meta name="description" content="Military-grade GATE Data Science & AI preparation tracker with AI-powered mentoring, spaced repetition, mind maps, and analytics.">
    <meta name="theme-color" content="#3b82f6">
    <meta property="og:title" content="GATE DA War Room">
    <meta property="og:description" content="Military-grade GATE Data Science & AI preparation tracker">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/split.js/1.6.5/split.min.js"></script>
    <!-- Pyodide for Browser Python Execution -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
    
    <!-- TensorFlow.js for Local ML Model -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0"></script>

    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Specific layout styles inline for speed */
        .topbar { display: flex; align-items: center; padding: 15px 30px; border-bottom: 1px solid var(--border); background: var(--bg-primary); }
        .view-title { font-size: 1.5rem; flex: 1; }
    </style>
</head>
<body>
    <div id="app">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">GATE DA<br>WAR ROOM</div>
            </div>
            <nav class="nav-menu">
                <div class="nav-item active" data-view="briefing">📊 Daily Briefing</div>
                <div class="nav-item" data-view="dashboard">📈 Dashboard</div>
                <div class="nav-item" data-view="tracker">🗂️ Tracker</div>
                <div class="nav-item" data-view="mindmap">🗺️ Mind Map</div>
                <div class="nav-item" data-view="pyq">📝 PYQ Bank</div>
                <div class="nav-item" data-view="coding">💻 Code Arena</div>
                <div class="nav-item" data-view="mentor">🤖 AI Mentor</div>
                <div class="nav-item" data-view="analytics">🔬 Analytics</div>
                <div class="nav-item" data-view="settings" style="margin-top: 20px; border-top: 1px solid var(--border); padding-top: 15px;">🔑 API Vault & Settings</div>
            </nav>
            <div class="sidebar-footer">
                <button class="btn" id="export-btn">💾 Export Data</button>
                <button class="btn" id="import-btn">📂 Import Data</button>
                <input type="file" id="import-file" style="display:none" accept=".json">
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <button class="mobile-toggle" id="mobile-toggle">☰</button>
                <h2 class="view-title" id="view-title">Daily Briefing</h2>
            </header>

            <!-- Views -->
            <section id="view-briefing" class="view-section active">
                <div id="briefing-container"></div>
            </section>

            <section id="view-dashboard" class="view-section">
                <div id="dashboard-container"></div>
            </section>

            <section id="view-tracker" class="view-section">
                <div id="tracker-container"></div>
            </section>

            <section id="view-mindmap" class="view-section">
                <div id="mindmap-container"></div>
            </section>

            <section id="view-pyq" class="view-section">
                <div id="pyq-container"></div>
            </section>

            <section id="view-coding" class="view-section" style="padding: 0; display: none; height: calc(100vh - 61px);">
                <div id="coding-container" style="display: flex; height: 100%; width: 100%;">
                    <div id="coding-left-pane" class="split">
                        <div id="coding-problem-content" style="padding: 20px; overflow-y: auto; height: 100%;">
                            <!-- Problem description goes here -->
                            <h3 style="color: var(--accent);">Problem Space</h3>
                            <p style="color: var(--text-secondary); margin-top: 10px;">Select a concept or PYQ to load the coding challenge.</p>
                        </div>
                    </div>
                    <div id="coding-right-pane" class="split" style="display: flex; flex-direction: column;">
                        <div id="coding-editor-container" class="split" style="flex: 1;">
                            <div id="monaco-editor" style="width: 100%; height: 100%;"></div>
                        </div>
                        <div id="coding-console-container" class="split" style="height: 30%;">
                            <div style="padding: 10px; background: #1e1e1e; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
                                <span style="font-size: 0.85rem; font-family: var(--font-mono); color: var(--text-muted);">Console Output</span>
                                <button id="btn-run-code" class="btn btn-primary" style="padding: 4px 12px; font-size: 0.85rem;">Run Code ▶</button>
                            </div>
                            <div id="coding-console-output" style="padding: 10px; font-family: var(--font-mono); font-size: 0.85rem; color: var(--text-secondary); overflow-y: auto; height: calc(100% - 40px); background: #0a0a0a;">
                                Ready...
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section id="view-mentor" class="view-section">
                <div id="mentor-container"></div>
            </section>

            <section id="view-analytics" class="view-section">
                <div id="analytics-container"></div>
            </section>

            <section id="view-settings" class="view-section">
                <div id="settings-container"></div>
            </section>
        </main>
    </div>

    <!-- Modals -->
    <div id="modal-container"></div>

    <!-- Scripts -->
    <script src="js/storage.js"></script>
    <script src="js/data.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/tracker.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/analytics.js"></script>
    <script src="js/mentor.js"></script>
    <script src="js/quiz.js"></script>
    <script src="js/mindmap.js"></script>
    <script src="js/pyq.js"></script>
    <script src="js/coding.js"></script>
    <script src="js/model.js"></script>
    <script src="js/focus.js"></script>
    <script src="js/app.js"></script>
    <!-- Monaco Editor Loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs/loader.min.js"></script>
</body>
</html>
